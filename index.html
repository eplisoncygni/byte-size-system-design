    (function () {

          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      };
      document.getElementById("hub-list").innerHTML = topics.map(function (t) {

                 '<span class="hub__day">Day ' + t.day + '</span>' +
                 '<span class="hub__text">' +
                   '<span class="hub__title">' + esc(t.title) + '</span>' +
                   (t.blurb ? '<span class="hub__blurb">' + esc(t.blurb) + '</span>' : '') +
                 '</span>' +
               '</a>';
      }).join("");
      var site = window.SITE || {};
      var foot = document.getElementById("hub-foot");
      foot.innerHTML =
        '<div>' + topics.length + ' topics and counting</div>' +
        '<div class="hub__legal">' +
          esc(site.license || "MIT") + '-licensed · © ' + esc(site.since || "") +
          " " + esc(site.author || "") +

            : "") +
