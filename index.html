<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Deep-Dives · Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/nav.css">
  <link rel="stylesheet" href="assets/base.css">
</head>
<body>
  <main class="hub">
    <div class="hub__kicker">Daily deep-dive · systems &amp; algorithms</div>
    <h1>The deep-dive index</h1>
    <p class="hub__lede">One surprise topic a day — data structures, storage internals, and distributed-systems primitives, threaded together as they build on each other.</p>

    <div class="hub__list" id="hub-list"></div>

    <div class="hub__foot" id="hub-foot"></div>
  </main>

  <script src="assets/topics.js"></script>
  <script>
    (function () {
      var topics = (window.TOPICS || []).slice().sort(function (a, b) {
        return a.day - b.day;
      });
      var esc = function (s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      };
      document.getElementById("hub-list").innerHTML = topics.map(function (t) {
        return '<a class="hub__item" href="' + esc(t.slug) + '.html">' +
                 '<span class="hub__day">Day ' + t.day + '</span>' +
                 '<span class="hub__title">' + esc(t.title) + '</span>' +
               '</a>';
      }).join("");
      document.getElementById("hub-foot").textContent =
        topics.length + " topics and counting";
    })();
  </script>
</body>
</html>
