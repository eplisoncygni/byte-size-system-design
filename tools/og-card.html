<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Newsreader:ital,opsz,wght@1,6..72,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #faf6ef;
    color: #2b2722;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 84px 96px;
    position: relative;
    overflow: hidden;
  }
  /* thin accent rule down the left edge */
  body::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 14px;
    background: #b4541e;
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #b4541e;
    margin-bottom: 26px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: 92px;
    line-height: 1.03;
    letter-spacing: -0.02em;
    margin-bottom: 30px;
  }
  h1.long { font-size: 74px; }
  .blurb {
    font-family: 'Newsreader', Georgia, serif;
    font-style: italic;
    font-size: 30px;
    line-height: 1.45;
    color: #6f675c;
    max-width: 46ch;
  }
  .mark {
    position: absolute;
    right: 88px;
    bottom: 76px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 19px;
    letter-spacing: 0.08em;
    color: #6f675c;
  }
</style>
</head>
<body>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p class="blurb" id="blurb"></p>
  <div class="mark">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#2b2722"/>
      <circle cx="16" cy="16" r="8.5" fill="none" stroke="#faf6ef" stroke-width="2.4"/>
      <circle cx="16" cy="7.5" r="3.3" fill="#b4541e"/>
    </svg>
    <span id="mark-text"></span>
  </div>
<script>
  var q = new URLSearchParams(location.search);
  var kicker = q.get("kicker") || "";
  var title = q.get("title") || "";
  var blurb = q.get("blurb") || "";
  document.getElementById("kicker").textContent = kicker;
  var h = document.getElementById("title");
  h.textContent = title;
  if (title.length > 18) h.className = "long";
  document.getElementById("blurb").textContent = blurb;
  document.getElementById("mark-text").textContent = q.get("mark") || "";
</script>
</body>
</html>
